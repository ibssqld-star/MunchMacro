document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:#ff6b1a; color:#14100c;\">Save &amp; add to frequents<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div ref=\"{{ pickerRef }}\"><\u002Fdiv>\n\n        <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:1.5px; color:#ffffff; margin-bottom:8px;\">ALL FOODS<\u002Fdiv>\n        <div style=\"font-size:12px; color:#ffffff; margin-bottom:8px;\">Tap a food, then choose how much 🐾<\u002Fdiv>\n        <div ref=\"{{ logListRef }}\" style=\"border:1px solid #26262e; border-radius:16px; overflow:hidden; max-height:400px; overflow-y:auto;\"><\u002Fdiv>\n      <\u002Fsection>\n      <aside style=\"background:#17171b; border:1px solid #2c2c34; border-radius:24px; padding:24px 26px; box-shadow:0 20px 44px -34px rgba(60,50,40,.6); position:sticky; top:20px;\">\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px;\">\n          <h2 style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:19px; margin:0; white-space:nowrap;\">Today's log<\u002Fh2>\n          <button sc-camel-on-click=\"{{ resetDay }}\" style=\"font-family:Nunito; font-size:12px; font-weight:700; color:#ffffff; background:none; border:none; cursor:pointer;\">Clear<\u002Fbutton>\n        <\u002Fdiv>\n        <div ref=\"{{ logTotalsRef }}\" style=\"font-size:12.5px; color:#ffffff; margin-bottom:10px;\">0 kcal<\u002Fdiv>\n        <div ref=\"{{ logEntriesRef }}\" style=\"max-height:520px; overflow-y:auto;\"><\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ PETS ============ -->\n    <sc-if value=\"{{ onPets }}\" hint-placeholder-val=\"{{ false }}\">\n    <section>\n      <div style=\"display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px;\">\n        <div>\n          <h2 style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:26px; margin:0;\">Your pandas<\u002Fh2>\n          <p style=\"font-size:14px; color:#ffffff; margin:4px 0 0;\">Feed and level up your buddy to unlock the rare ones. Tap a panda to set it active.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div ref=\"{{ petGridRef }}\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:22px;\"><\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- ============ BODY ============ -->\n    <sc-if value=\"{{ onBody }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"pm-two\" style=\"display:grid; grid-template-columns:1fr 1.3fr; gap:22px; align-items:start;\">\n      <section style=\"background:#17171b; border:1px solid #2c2c34; border-radius:24px; padding:24px 26px; box-shadow:0 20px 44px -34px rgba(60,50,40,.6);\">\n        <h2 style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; margin:0 0 4px;\">Body weight ⚖️<\u002Fh2>\n        <p style=\"font-size:13px; color:#ffffff; margin:0 0 16px;\">Step on your Bluetooth body scale to read your weight, then save it to track the trend.<\u002Fp>\n        <div ref=\"{{ scaleBarBodyRef }}\"><\u002Fdiv>\n        <div ref=\"{{ bodyReadoutRef }}\"><\u002Fdiv>\n      <\u002Fsection>\n      <section>\n        <h2 style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; margin:0 0 14px;\">History<\u002Fh2>\n        <div ref=\"{{ bodyListRef }}\" style=\"display:flex; flex-direction:column; gap:10px;\"><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ SHOPPING LIST ============ -->\n    <sc-if value=\"{{ onShop }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"pm-two\" style=\"display:grid; grid-template-columns:1fr 1.4fr; gap:22px; align-items:start;\">\n      <section style=\"background:#17171b; border:1px solid #2c2c34; border-radius:24px; padding:24px 26px; box-shadow:0 20px 44px -34px rgba(60,50,40,.6); position:sticky; top:20px;\">\n        <h2 style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; margin:0 0 4px;\">Add to list 🛒<\u002Fh2>\n        <p style=\"font-size:13px; color:#ffffff; margin:0 0 16px;\">Jot down what you need. Ask Bamboo to add ingredients for a recipe and they'll land here too.<\u002Fp>\n        <input ref=\"{{ shopInputRef }}\" sc-camel-on-key-down=\"{{ onShopKey }}\" placeholder=\"e.g. Chicken breast 1kg\" style=\"width:100%; padding:13px 15px; border-radius:13px; border:1.5px solid #34343d; background:#1f1f25; font-family:Nunito; font-weight:700; font-size:14.5px; outline:none; margin-bottom:10px;\">\n        <div ref=\"{{ shopCatRowRef }}\" style=\"display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px;\"><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ addShop }}\" style=\"width:100%; padding:13px; border-radius:13px; border:none; cursor:pointer; font-family:Fredoka; font-weight:600; font-size:15px; background:#ffa53d; color:#14100c;\">Add item 🎋<\u002Fbutton>\n        <div style=\"margin-top:18px; padding-top:16px; border-top:1px dashed #2c2c34;\">\n          <button sc-camel-on-click=\"{{ addLowStock }}\" style=\"width:100%; padding:11px; border-radius:12px; border:1.5px solid #34343d; background:#1f1f25; cursor:pointer; font-family:Nunito; font-weight:800; font-size:13px; color:#ffffff;\">＋ Add my frequent foods<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section>\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;\">\n          <div>\n            <h2 style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; margin:0;\">Shopping list<\u002Fh2>\n            <span ref=\"{{ shopCountRef }}\" style=\"font-size:13px; color:#ffffff;\">0 items<\u002Fspan>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ clearBought }}\" style=\"font-family:Nunito; font-size:12px; font-weight:800; color:#ffffff; background:none; border:none; cursor:pointer;\">Clear ticked<\u002Fbutton>\n        <\u002Fdiv>\n        <div ref=\"{{ shopListRef }}\" style=\"display:flex; flex-direction:column; gap:16px;\"><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ MEAL PREP ============ -->\n    <sc-if value=\"{{ onPrep }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"pm-two\" style=\"display:grid; grid-template-columns:1fr 1.6fr; gap:22px; align-items:start;\">\n      <section style=\"background:#17171b; border:1px solid #2c2c34; border-radius:24px; padding:24px 26px; box-shadow:0 20px 44px -34px rgba(60,50,40,.6); position:sticky; top:20px;\">\n        <h2 style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; margin:0 0 4px;\">New meal prep<\u002Fh2>\n        <p style=\"font-size:13px; color:#ffffff; margin:0 0 16px;\">Cooked a batch? Add each ingredient and how much you used — we'll work out the macros per serving. Then tick servings off through the week.<\u002Fp>\n        <input ref=\"{{ prepNameRef }}\" placeholder=\"e.g. Chicken &amp; rice batch\" style=\"width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid #34343d; background:#1f1f25; font-family:Nunito; font-weight:700; font-size:14px; outline:none; margin-bottom:12px;\">\n        <label style=\"display:block; font-size:12px; font-weight:800; color:#ffffff; margin-bottom:5px;\">Servings this batch made<\u002Flabel>\n        <input ref=\"{{ prepServingsRef }}\" sc-camel-on-input=\"{{ onPrepServings }}\" type=\"number\" sc-camel-default-value=\"4\" style=\"width:100%; padding:12px 14px; border-radius:12px; border:1.5px solid #34343d; background:#1f1f25; font-family:Nunito; font-weight:700; font-size:14px; outline:none; margin-bottom:14px;\">\n        <div ref=\"{{ scaleBarPrepRef }}\"><\u002Fdiv>\n        <label style=\"display:block; font-size:12px; font-weight:800; color:#ffffff; margin-bottom:6px;\">Ingredients in the whole batch 🥕<\u002Flabel>\n        <input ref=\"{{ prepIngSearchRef }}\" sc-camel-on-input=\"{{ onPrepIngSearch }}\" placeholder=\"Search an ingredient to add…\" style=\"width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid #34343d; background:#1f1f25; font-family:Nunito; font-weight:700; font-size:13.5px; outline:none;\">\n        <div ref=\"{{ prepIngResultsRef }}\"><\u002Fdiv>\n        <div ref=\"{{ prepIngListRef }}\" style=\"margin-top:10px;\"><\u002Fdiv>\n        <div ref=\"{{ prepTotalsRef }}\" style=\"margin-top:12px;\"><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ addPrep }}\" style=\"width:100%; margin-top:14px; padding:13px; border-radius:12px; border:none; cursor:pointer; font-family:Fredoka; font-weight:600; font-size:15px; background:#ff8c42; color:#14100c;\">Add meal prep<\u002Fbutton>\n      <\u002Fsection>\n      <section>\n        <div style=\"display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;\">\n          <h2 style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:22px; margin:0;\">Your meal preps<\u002Fh2>\n          <span style=\"font-size:13px; color:#ffffff;\">Tap a serving to log it to today<\u002Fspan>\n        <\u002Fdiv>\n        <div ref=\"{{ prepListRef }}\" style=\"display:flex; flex-direction:column; gap:16px;\"><\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <!-- ============ FLOATING COACH ============ -->\n  <button sc-camel-on-click=\"{{ toggleCoach }}\" title=\"Chat with Bamboo\" style=\"position:fixed; right:26px; bottom:26px; z-index:60; width:66px; height:66px; border-radius:50%; border:3px solid #17171b; cursor:pointer; background:linear-gradient(#ff6b1a,#c74a08); box-shadow:0 14px 30px -10px rgba(42,151,162,.75); display:flex; align-items:center; justify-content:center; font-size:30px; animation:pm-floaty 3.6s ease-in-out infinite;\">🐼<\u002Fbutton>\n\n  <sc-if value=\"{{ coachOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"pm-coach-panel\" style=\"position:fixed; right:26px; bottom:104px; z-index:61; width:400px; max-width:calc(100vw - 40px); height:min(600px, calc(100vh - 150px)); background:#17171b; border:2px solid #d9eef1; border-radius:24px; box-shadow:0 30px 60px -22px rgba(60,50,40,.55); overflow:hidden; display:flex; flex-direction:column; animation:pm-pop .22s ease both;\">\n    <div style=\"display:flex; align-items:center; gap:11px; padding:15px 18px; border-bottom:1px solid #26262e; background:linear-gradient(#241a12,#17171b);\">\n      <div style=\"width:38px; height:38px; border-radius:12px; background:#ff6b1a; display:flex; align-items:center; justify-content:center; font-size:20px;\">🐼<\u002Fdiv>\n      <div style=\"flex:1;\">\n        <div style=\"font-family:'Fredoka',sans-serif; font-weight:700; font-size:17px;\">Bamboo Coach<\u002Fdiv>\n        <div style=\"font-size:11.5px; color:#ffffff;\">Macros, meal ideas &amp; logging 🎋<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ toggleCoach }}\" style=\"border:none; background:none; cursor:pointer; color:#ffffff; font-size:17px; padding:4px 6px;\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div ref=\"{{ coachBoxRef }}\" style=\"flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:10px;\"><\u002Fdiv>\n    <div ref=\"{{ coachPreviewRef }}\" style=\"padding:0 18px;\"><\u002Fdiv>\n    <button sc-camel-on-click=\"{{ insertScaleWeight }}\" ref=\"{{ coachScaleChipRef }}\" style=\"display:none; margin:0 18px 8px; align-items:center; justify-content:center; gap:6px; cursor:pointer; font-family:Nunito; font-weight:800; font-size:12px; padding:9px 12px; border-radius:11px; border:1.5px solid #4a2a14; background:#241a12; color:#ffab5e;\"><\u002Fbutton>\n    <div ref=\"{{ coachChipsRef }}\" style=\"display:flex; gap:6px; flex-wrap:wrap; padding:0 18px 10px;\"><\u002Fdiv>\n    <div style=\"display:flex; gap:8px; align-items:center; padding:13px 18px; border-top:1px solid #26262e;\">\n      <input ref=\"{{ coachFileRef }}\" sc-camel-on-change=\"{{ onCoachFile }}\" type=\"file\" accept=\"image/*\" style=\"display:none;\">\n      <button sc-camel-on-click=\"{{ pickCoachImage }}\" title=\"Attach a photo of your food\" style=\"width:42px; height:42px; flex:none; border-radius:12px; border:1.5px solid #34343d; background:#1f1f25; cursor:pointer; font-size:18px;\">📷<\u002Fbutton>\n      <input ref=\"{{ coachInputRef }}\" sc-camel-on-key-down=\"{{ onCoachKey }}\" placeholder=\"Ask or snap your meal…\" style=\"flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1.5px solid #34343d; background:#1f1f25; font-family:Nunito; font-weight:600; font-size:14px; outline:none;\">\n      <button sc-camel-on-click=\"{{ sendCoach }}\" style=\"padding:12px 18px; flex:none; border-radius:12px; border:none; cursor:pointer; font-family:Fredoka; font-weight:600; font-size:14px; background:#ff6b1a; color:#14100c;\">Send<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- toast -->\n  <div ref=\"{{ toastRef }}\" style=\"position:fixed; left:50%; bottom:34px; transform:translate(-50%,14px); opacity:0; background:#26262e; color:#f4f1ea; font-weight:700; font-size:14px; padding:12px 20px; border-radius:999px; box-shadow:0 16px 30px -14px rgba(0,0,0,.5); z-index:50;\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'dashboard',\n    goals: { cal:2000, protein:150, carbs:220, fat:65, fiber:30, water:8 },\n    consumed: { cal:0, protein:0, carbs:0, fat:0, fiber:0, water:0 },\n    bamboo: 0,\n    claimed: {},\n    level: 1, xp: 0, energy: 60,\n    eating: false,\n    log: [],\n    query: '',\n    unlocked: { momo:true, bao:false, nova:false },\n    active: 'momo',\n    showCustom: false,\n    frequents: ['Chicken breast','Banana','Greek yogurt'],\n    mealPreps: [\n      { id:'seed1', name:'Chicken, rice & broccoli', emoji:'🍱', servings:5, consumed:1, per:{ cal:430, protein:42, carbs:48, fat:8, fiber:5 } },\n    ],\n    chat: [],\n    chatLoading: false,\n    coachOpen: false,\n    shopping: [\n      { id:'s1', name:'Chicken breast 1kg', cat:'Protein', done:false },\n      { id:'s2', name:'Greek yogurt', cat:'Dairy', done:false },\n      { id:'s3', name:'Spinach', cat:'Produce', done:true },\n    ],\n    bodyLog: [],\n    authChecked: false, signedIn: false, email: '', authMsg: '', authSending: false, authSent: false,\n  };\n  shopCats = ['Produce','Protein','Dairy','Pantry','Snacks','Other'];\n  shopCat = 'Produce';\n\n  // ---------- Bluetooth scale ----------\n  SCALE = {\n    ultreanService: '0000ffff-0000-1000-8000-00805f9b34fb',\n    ultreanWeight:  '0000ff02-0000-1000-8000-00805f9b34fb',\n    ultreanCommand: '0000ff01-0000-1000-8000-00805f9b34fb',\n    weightScale:    '0000181d-0000-1000-8000-00805f9b34fb',\n    weightMeas:     '00002a9d-0000-1000-8000-00805f9b34fb',\n    bodyComp:       '0000181b-0000-1000-8000-00805f9b34fb',\n    battery:        '0000180f-0000-1000-8000-00805f9b34fb',\n  };\n  scale = { status:'idle', name:'', grams:0, kg:0, msg:'', mode:'food', tare:0 };\n  scaleFollow = true;\n\n  scaleSupported(){ return typeof navigator !== 'undefined' && 'bluetooth' in navigator && window.isSecureContext; }\n  scaleUnavailableReason(){\n    if(typeof navigator === 'undefined' || !('bluetooth' in navigator)) return 'Needs Chrome or Edge — Safari/iOS can\\'t do Web Bluetooth.';\n    if(!window.isSecureContext) return 'Needs a secure (https) page.';\n    return '';\n  }\n  setScale(patch){\n    this.scale = { ...this.scale, ...patch };\n    this.paintScale();\n    // BLE events live outside React — force a render so every scale-aware\n    // surface (Body readout, prep rows, picker label) updates too.\n    clearTimeout(this._scaleTick);\n    this._scaleTick = setTimeout(() => this.forceUpdate(), 60);\n  }\n\n  // Ultrean UL-KS09: byte 7 = digit count, then that many ASCII digits = grams\n  parseUltrean(dv){\n    try {\n      const n = dv.getUint8(7);\n      if(n < 1 || n > 8) return null;\n      let s = '';\n      for(let i=0;i<n;i++){\n        const b = dv.getUint8(8+i);\n        if(b < 0x30 || b > 0x39) return null;\n        s += String.fromCharCode(b);\n      }\n      const g = parseInt(s, 10);\n      return isFinite(g) ? g : null;\n    } catch(e){ return null; }\n  }\n  // Standard SIG Weight Measurement (2A9D)\n  parseSig(dv){\n    try {\n      const flags = dv.getUint8(0);\n      const raw = dv.getUint16(1, true);\n      return (flags & 0x01) ? raw * 0.01 * 0.45359237 : raw * 0.005; // lb→kg, else kg\n    } catch(e){ return null; }\n  }\n\n  async connectScale(mode){\n    if(!this.scaleSupported()){ this.setScale({ status:'error', msg:this.scaleUnavailableReason() }); return; }\n    try {\n      this.setScale({ status:'connecting', msg:'', mode: mode || 'food' });\n      const S = this.SCALE;\n      const device = await navigator.bluetooth.requestDevice({\n        acceptAllDevices: true,\n        optionalServices: [S.ultreanService, S.weightScale, S.bodyComp, S.battery],\n      });\n      this._scaleDevice = device;\n      device.addEventListener('gattserverdisconnected', () => this.setScale({ status:'idle', msg:'Scale disconnected' }));\n      const server = await device.gatt.connect();\n\n      let hooked = false;\n      // 1) Ultrean / clone protocol\n      try {\n        const svc = await server.getPrimaryService(S.ultreanService);\n        const ch = await svc.getCharacteristic(S.ultreanWeight);\n        await ch.startNotifications();\n        ch.addEventListener('characteristicvaluechanged', (e) => {\n          const g = this.parseUltrean(e.target.value);\n          if(g === null) return;\n          this.setScale({ grams:g, kg:Math.round(g/100)/10 });\n          this.onScaleReading();\n        });\n        try { const v = await ch.readValue(); const g = this.parseUltrean(v); if(g!==null) this.setScale({ grams:g }); } catch(e){}\n        hooked = true;\n      } catch(e){}\n      // 2) Standard SIG weight scale (most body scales)\n      if(!hooked){\n        try {\n          const svc = await server.getPrimaryService(S.weightScale);\n          const ch = await svc.getCharacteristic(S.weightMeas);\n          await ch.startNotifications();\n          ch.addEventListener('characteristicvaluechanged', (e) => {\n            const kg = this.parseSig(e.target.value);\n            if(kg === null) return;\n            this.setScale({ kg:Math.round(kg*10)/10, grams:Math.round(kg*1000) });\n            this.onScaleReading();\n          });\n          hooked = true;\n        } catch(e){}\n      }\n      if(!hooked){ this.setScale({ status:'error', msg:'Connected, but no known weight service found.' }); return; }\n      this.setScale({ status:'connected', name:device.name || 'Scale', msg:'' });\n      this.toast('⚖️ ' + (device.name || 'Scale') + ' connected');\n    } catch(err){\n      if(err && err.name === 'NotFoundError'){ this.setScale({ status:'idle', msg:'' }); return; }\n      this.setScale({ status:'error', msg:(err && err.message) || 'Could not connect' });\n    }\n  }\n  disconnectScale(){\n    try { if(this._scaleDevice && this._scaleDevice.gatt.connected) this._scaleDevice.gatt.disconnect(); } catch(e){}\n    this.setScale({ status:'idle', grams:0, kg:0 });\n  }\n  netGrams(){ return Math.max(0, this.scale.grams - this.scale.tare); }\n  tareScale(){ this.setScale({ tare:this.scale.grams }); this.toast('⚖️ Tared'); }\n  onScaleReading(){\n    if(!this.scaleFollow) return;\n    const g = this.netGrams();\n    if(this.pick && this.pick.unit === 'g'){ this.pickQty = g; this.paintPickerPreview(); }\n  }\n  toggleFollow(){ this.scaleFollow = !this.scaleFollow; this.forceUpdate(); this.toast(this.scaleFollow ? '⚖️ Following scale live' : '⚖️ Live follow off'); }\n  useScaleHere(){\n    const g = this.netGrams();\n    if(!g){ this.toast('No weight on the scale yet'); return; }\n    if(this.pick){\n      if(this.pick.unit !== 'g'){ this.toast('This food is measured in ' + this.pick.unit); return; }\n      this.pickQty = g; this.paintPicke etState(s => ({ chat:[...s.chat, userMsg], chatLoading:true }), async () => {\n      const c = this.state.consumed, g = this.state.goals;\n      const remaining = { cal:g.cal-c.cal, protein:g.protein-c.protein, carbs:g.carbs-c.carbs, fat:g.fat-c.fat, fiber:g.fiber-c.fiber };\n      const preps = this.state.mealPreps.map(p => p.name+' ('+(p.servings-p.consumed)+' servings left, '+p.per.cal+' kcal / '+p.per.protein+'g protein each)').join('; ') || 'none';\n      const system = 'You are Bamboo, a warm, upbeat nutrition coach living inside the Panda Macros app. '\n        + 'Keep replies short and practical — 2-4 sentences or a tight bullet list, with rough macros for any food you suggest. '\n        + 'Use the user\\'s real numbers. Goals (g & kcal): '+JSON.stringify(g)+'. Eaten today: '+JSON.stringify(c)+'. Remaining: '+JSON.stringify(remaining)+'. '\n        + (this.scale.status === 'connected'\n            ? 'Their Bluetooth scale is connected and currently reads ' + this.netGrams() + ' g — if they mention \"on the scale\" or ask you to log what they just weighed, use that exact weight. '\n            : '')\n        + 'Meal preps they have ready: '+preps+'. Prefer suggesting their meal preps when they fit. Occasionally cheer them on toward feeding their panda. Never give medical advice. '\n        + 'IMPORTANT — logging: when the user asks you to log/add a food or meal to their day (or accepts a suggestion), append a single machine-readable directive on its OWN LAST LINE, exactly: '\n        + '@@LOG:[{\"name\":\"Grilled chicken\",\"cal\":300,\"protein\":40,\"carbs\":5,\"fat\":8,\"fiber\":1,\"meal\":\"Dinner\"}]@@ . '\n        + 'Use one object per food, realistic integer macros, meal one of Breakfast/Lunch/Dinner/Snack. Only include @@LOG when they actually want it logged. Never mention the directive syntax in your prose. '\n        + 'MEAL PREP: when the user asks you to add a batch/meal-prep to their inventory, append instead (or additionally) a last line: '\n        + '@@PREP:[{\"name\":\"Beef chilli batch\",\"servings\":5,\"cal\":420,\"protein\":35,\"carbs\":40,\"fat\":14,\"fiber\":9}]@@ where macros are PER SERVING. '\n        + 'SHOPPING LIST: when they ask for ingredients, a recipe\\'s shopping items, or to add something to their list, append a last line: '\n        + '@@SHOP:[{\"name\":\"Chicken breast 1kg\",\"cat\":\"Protein\"}]@@ with cat one of Produce/Protein/Dairy/Pantry/Snacks/Other. Their current list: '+(this.state.shopping.map(i=>i.name).join(', ')||'empty')+'. '\n        + 'PHOTOS: if the user sends a food photo, identify the items and estimate portions and macros, then log them with @@LOG (or @@PREP if they say it is a batch they cooked). Say what you assumed.';\n      try {\n        const messages = this.state.chat.map(m => {\n          if(m._img){\n            return { role:m.role, content:[\n              { type:'image', source:{ type:'base64', media_type:m._img.media_type, data:m._img.data } },\n              { type:'text', text:m.content },\n            ]};\n          }\n          return { role:m.role, content:m.content };\n        });\n        const raw = ((await this.askCoach({ system, messages, max_tokens:600 })) || '').trim();\n        let display = raw, added = [];\n        const m = raw.match(/@@LOG:(\\[[\\s\\S]*?\\])@@/);\n        if(m){\n          display = raw.replace(m[0], '').trim();\n          try {\n            const items = JSON.parse(m[1]);\n            items.forEach(it => {\n              const fd = { name:String(it.name||'Food'), emoji:'🍽️',\n                cal:Math.max(0,Math.round(+it.cal||0)), protein:Math.max(0,Math.round(+it.protein||0)),\n                carbs:Math.max(0,Math.round(+it.carbs||0)), fat:Math.max(0,Math.round(+it.fat||0)), fiber:Math.max(0,Math.round(+it.fiber||0)) };\n              this.addFood(fd, it.meal || 'Snack');\n              added.push(fd);\n            });\n          } catch(err){}\n        }\n        if(added.length){\n          const totalCal = added.reduce((a,b)=>a+b.cal,0);\n          display += (display?'\\n\\n':'') + '✅ Logged ' + added.map(a=>a.name).join(', ') + ' (' + totalCal + ' kcal) to your day.';\n          this.toast('🍽️ Coach logged ' + added.length + ' item' + (added.length>1?'s':''));\n        }\n        const sm = display.match(/@@SHOP:(\\[[\\s\\S]*?\\])@@/);\n        if(sm){\n          display = display.replace(sm[0], '').trim();\n          try {\n            const items = JSON.parse(sm[1]); const names = [];\n            items.forEach(it => { const added = this.addShopItem(it.name, it.cat); if(added) names.push(added.name); });\n            if(names.length){\n              display += (display?'\\n\\n':'') + '🛒 Added to your shopping list: ' + names.join(', ') + '.';\n              this.toast('🛒 Coach added ' + names.length + ' item' + (names.length>1?'s':''));\n            }\n          } catch(err){}\n        }\n        const pm = display.match(/@@PREP:(\\[[\\s\\S]*?\\])@@/);\n        if(pm){\n          display = display.replace(pm[0], '').trim();\n          try {\n            const preps = JSON.parse(pm[1]);\n            const made = [];\n            preps.forEach(p => {\n              const prep = { id:'p'+Date.now()+Math.random(), name:String(p.name||'Meal prep'), emoji:'🍱',\n                servings:Math.max(1, Math.round(+p.servings||1)), consumed:0,\n                per:{ cal:Math.max(0,Math.round(+p.cal||0)), protein:Math.max(0,Math.round(+p.protein||0)),\n                      carbs:Math.max(0,Math.round(+p.carbs||0)), fat:Math.max(0,Math.round(+p.fat||0)), fiber:Math.max(0,Math.round(+p.fiber||0)) } };\n              this.setState(s => ({ mealPreps:[prep, ...s.mealPreps] }));\n              made.push(prep);\n            });\n            if(made.length){\n              display += (display?'\\n\\n':'') + '🍱 Added to your meal prep: ' + made.map(p=>p.name+' ('+p.servings+' servings)').join(', ') + '.';\n              this.toast('🍱 Coach stocked your meal prep');\n            }\n          } catch(err){}\n        }\n        this.setState(s => ({ chat:[...s.chat, { role:'assistant', content:display || 'Hmm, try asking that a different way?' }], chatLoading:false }));\n      } catch(e) {\n        this.setState(s => ({ chat:[...s.chat, { role:'assistant', content:'I couldn\\'t reach my brain just now 🐼 — give it another try in a moment.' }], chatLoading:false }));\n      }\n    });\n  }\n\n  buildPets(){\n    if(this.state.screen !== 'pets') return;\n    const grid = this.refs.petGrid.current;\n    if(!grid) return;\n    const pets = [\n      { key:'momo', name:'Momo', tier:'Common', accent:'#ff6b1a', soft:'#241a12', req:'Starter buddy', ear:'#ff6b1a' },\n      { key:'bao', name:'Bao', tier:'Rare', accent:'#ff8c42', soft:'#241a12', req:'Reach Level 5', ear:'#ff8c42' },\n      { key:'nova', name:'Nova', tier:'Legendary', accent:'#ff6b1a', soft:'#241a12', req:'7-day streak', ear:'#ff6b1a' },\n    ];\n    grid.innerHTML = '';\n    pets.forEach(p => {\n      const unlocked = this.state.unlocked[p.key];\n      const active = this.state.active === p.key;\n      const card = document.createElement('div');\n      card.style.cssText = 'position:relative; background:#17171b; border:2px solid '+(active?p.accent:'#2c2c34')+'; border-radius:22px; padding:20px; box-shadow:0 18px 40px -32px rgba(60,50,40,.6); '+(unlocked?'':'opacity:.62;');\n      card.innerHTML =\n        '<div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;\">'\n        + '<span style=\"font-family:Space Mono,monospace; font-size:10px; letter-spacing:1.5px; color:'+p.accent+'; border:1.5px solid '+p.accent+'44; padding:4px 10px; border-radius:999px;\">'+p.tier.toUpperCase()+'<\u002Fspan>'\n        + (unlocked ? (active?'<span style=\"font-size:11px; font-weight:800; color:'+p.accent+';\">● ACTIVE<\u002Fspan>':'') : '<span style=\"font-size:16px;\">🔒<\u002Fspan>')\n        + '<\u002Fdiv>'\n        + '<div style=\"position:relative; height:150px; border-radi rrent;\n    if(fl) fl.textContent = this.state.bamboo < 2 ? 'Need 2 bamboo' : 'Feed Momo · 2 bamboo';\n    const fb = this.refs.feedBtn.current;\n    if(fb){ fb.style.opacity = this.state.bamboo < 2 ? '.5' : '1'; fb.style.cursor = this.state.bamboo < 2 ? 'not-allowed' : 'pointer'; }\n  }\n\n  tab(name){\n    const active = this.state.screen === name;\n    return 'font-family:Nunito; font-weight:800; font-size:14px; white-space:nowrap; cursor:pointer; border:none; padding:9px 18px; border-radius:10px; background:'\n      + (active ? '#ff6b1a' : 'transparent') + '; color:' + (active ? '#14100c' : '#9a949f') + ';';\n  }\n\n  renderVals(){\n    const s = this.state, r = this.refs;\n    return {\n      onDash: s.screen==='dashboard', onLog: s.screen==='log', onPets: s.screen==='pets',\n      onPrep: s.screen==='prep', onShop: s.screen==='shop', onBody: s.screen==='body', coachOpen: s.coachOpen,\n      showAuth: s.authChecked && !s.signedIn && !s.offline && !!this.sb,\n      signOut: () => this.signOut(),\n      authBoxRef: r.authBox, signOutRef: r.signOut,\n      showCustom: s.showCustom,\n      eating: s.eating,\n      calGoal: s.goals.cal,\n      goDash: () => this.setState({ screen:'dashboard' }),\n      goLog: () => this.setState({ screen:'log' }),\n      goPrep: () => this.setState({ screen:'prep' }),\n      goPets: () => this.setState({ screen:'pets' }),\n      goShop: () => this.setState({ screen:'shop' }),\n      goBody: () => this.setState({ screen:'body' }),\n      insertScaleWeight: () => this.insertScaleWeight(),\n      onPrepIngSearch: (e) => { this.prepQuery = e.target.value; this.paintPrepBuilder(); },\n      onPrepServings: () => this.paintPrepTotalsOnly(),\n      addShop: () => this.addShop(), clearBought: () => this.clearBought(), addLowStock: () => this.addLowStock(),\n      onShopKey: (e) => { if(e.key === 'Enter'){ e.preventDefault(); this.addShop(); } },\n      toggleCoach: () => this.setState(st => ({ coachOpen: !st.coachOpen })),\n      pickCoachI
